# Publica la carpeta web/ en https://kvothesson.com/tachan/
# Corre cuando cambia algo de web/ en main, o a mano desde la pestaña Actions.
name: Publicar la web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # deploy-pages busca el artifact de la corrida por la API
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.subir.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: subir
        uses: actions/deploy-pages@v4
