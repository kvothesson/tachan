<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandar a la compu</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
         gap: 16px; padding: 16px; box-sizing: border-box; background: #1f2125; color: #e8e8e8;
         font: 18px system-ui, sans-serif; text-align: center; }
  label { display: block; padding: 48px 16px; border-radius: 16px; background: #2f6fed; color: #fff;
          font-size: 24px; font-weight: 600; }
  input { display: none; }
  #estado { min-height: 3em; color: #b8bbc1; }
</style>
</head>
<body>
  <label>Elegir fotos<input id="fotos" type="file" accept="image/*,video/*" multiple></label>
  <div id="estado">Van directo a la compu.</div>
  <a id="app" style="color:#8fb4ff">Instalar la app para que aparezca en Compartir (Android)</a>
<script>
  const token = new URLSearchParams(location.search).get("t");
  document.getElementById("app").href = "/app.apk?t=" + encodeURIComponent(token);
  const estado = document.getElementById("estado");
  const entrada = document.getElementById("fotos");
  entrada.addEventListener("change", async () => {
    const fotos = [...entrada.files];
    let llegaron = 0;
    for (const foto of fotos) {
      estado.textContent = `Mandando ${llegaron + 1} de ${fotos.length}...`;
      try {
        const r = await fetch("/foto", {
          method: "POST",
          headers: { "X-Token": token, "X-Nombre": encodeURIComponent(foto.name) },
          body: foto,
        });
        if (!r.ok) throw new Error(r.status);
        llegaron++;
      } catch (e) {
        estado.textContent = `Falló: llegaron ${llegaron} de ${fotos.length}. Fijate que estés en el wifi de casa.`;
        entrada.value = "";
        return;
      }
    }
    estado.textContent = llegaron === 1 ? "Listo, llegó." : `Listo, llegaron ${llegaron}.`;
    entrada.value = "";
  });
</script>
</body>
</html>
